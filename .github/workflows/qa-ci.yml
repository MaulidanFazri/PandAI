name: PandAI QA - Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  qa-ml-service-test:
    name: Test ML FastAPI & Latency (< 100ms)
    runs-on: ubuntu-26.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v7

      - name: 2. Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "ml-service/requirements.txt"

      - name: 3. Install Dependencies & Run Pytest
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -v

  qa-backend-test:
    name: Test Backend NestJS
    runs-on: ubuntu-26.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v7

      - name: 2. Set up Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: "apps/api/package-lock.json"

      - name: 3. Execute Backend Unit Tests
        working-directory: ./apps/api
        run: |
          npm ci
          npm test --if-present
